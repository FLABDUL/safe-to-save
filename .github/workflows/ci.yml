name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://sts_ci:sts_ci_password@127.0.0.1:55433/safe_to_save
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: sts_ci
          POSTGRES_PASSWORD: sts_ci_password
          POSTGRES_DB: safe_to_save
        ports:
          - "55433:5432"
        options: >-
          --health-cmd "pg_isready -U sts_ci -d safe_to_save"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Run unit tests
        run: python -m pytest -m "not integration" -v

      - name: Apply migrations
        run: >-
          python -c "import os; from pathlib import Path;
          from safe_to_save.db import apply_migrations;
          print('Applied:', apply_migrations(os.environ['DATABASE_URL'], Path('sql')))"

      - name: Run integration tests
        run: python -m pytest -m integration -v
